<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Note Viewer</title>

    <!-- Tailwind CSS for modern, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Marked.js for parsing Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- KaTeX for rendering Math Equations -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- 
    ========================================================================
    ⚙️ WEB FONT CONFIGURATION (Optional)
    ========================================================================
    -->
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com"> -->
    <!-- <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> -->
    <!-- <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet"> -->

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        obsidian: {
                            bg: '#ffffff',
                            text: '#2e3338',
                            darkBg: '#0a0d13', /* Custom dark background */
                            darkText: '#d1d5db', /* Neutral Gray-300 text */
                            accent: '#7c3aed', // Purple accent
                            darkAccent: '#a78bfa'
                        }
                    }
                }
            }
        }
    </script>

    <!-- 
    ========================================================================
    ⚙️ APP CONFIGURATION 
    ========================================================================
    -->
    <script>
        // password
        const APP_CONFIG = {
            // Set to false to disable
            ENABLE_GORIB: true, 
            
            // Set your desired key here
            APP_GORIB: "physicsisbest" 
        };
    </script>

    <style>
        /* ==========================================================
           ⚙️ LOCAL FONT CONFIGURATION
           ========================================================== */
        :root {
            --custom-main-font: 'Hind Siliguri', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* ==========================================================
           Custom Scrollbar Styling
           ========================================================== */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px; 
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background-color: rgba(148, 163, 184, 0.5); 
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background-color: rgba(100, 116, 139, 0.8); 
        }
        .dark ::-webkit-scrollbar-thumb {
            background-color: rgba(75, 85, 99, 0.5); 
        }
        .dark ::-webkit-scrollbar-thumb:hover {
            background-color: rgba(107, 114, 128, 0.8); 
        }

        #sidebar::-webkit-scrollbar {
            display: none;
            width: 0;
        }
        #sidebar {
            -ms-overflow-style: none;  
            scrollbar-width: none;  
        }

        /* ==========================================================
           Markdown Core Styles
           ========================================================== */
        body {
            font-family: var(--custom-main-font); 
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        .markdown-body {
            font-size: var(--note-font-size, 1.125rem); 
            line-height: 1.75;
            color: #2e3338;
            transition: font-size 0.2s ease;
        }

        .dark .markdown-body {
            color: #cbd5e1;
        }

        .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4, .markdown-body h5, .markdown-body h6 {
            font-weight: 700;
            margin-top: 2em;
            margin-bottom: 0.75em;
            color: #111827;
            scroll-margin-top: 6rem; 
        }

        .dark .markdown-body h1, .dark .markdown-body h2, .dark .markdown-body h3, .dark .markdown-body h4, .dark .markdown-body h5, .dark .markdown-body h6 {
            color: #f8fafc;
            border-bottom-color: #1f2937; 
        }

        .markdown-body p { margin-bottom: 1.25em; }
        
        .markdown-body a {
            color: #7c3aed;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }
        
        .dark .markdown-body a { color: #a78bfa; }
        .markdown-body a:hover { border-bottom-color: currentColor; }

        .markdown-body ul, .markdown-body ol {
            margin-bottom: 1.25em;
            padding-left: 1.5em;
        }
        
        .markdown-body li { margin-bottom: 0.5em; }
        .markdown-body ul { list-style-type: disc; }
        .markdown-body ol { list-style-type: decimal; }

        /* Standard Blockquote */
        .markdown-body blockquote:not(.obsidian-callout) {
            border-left: 4px solid #7c3aed;
            padding-left: 1rem;
            color: #4b5563;
            font-style: italic;
            background: #f3f4f6;
            padding: 1rem;
            border-radius: 0 0.5rem 0.5rem 0;
            margin: 1.5em 0;
        }

        .dark .markdown-body blockquote:not(.obsidian-callout) {
            background: #111827; 
            color: #9ca3af;
            border-left-color: #a78bfa;
        }

        /* ==========================================================
           Obsidian Native Callouts (Quotes)
           ========================================================== */
        .callout-note, .callout-info { --callout-color: 8, 109, 221; }
        .callout-danger, .callout-warning, .callout-error, .callout-bug { --callout-color: 233, 49, 71; }
        .callout-success, .callout-check, .callout-done { --callout-color: 8, 185, 78; }
        .callout-abstract, .callout-summary, .callout-tldr { --callout-color: 0, 176, 204; }
        .callout-tip { --callout-color: 0, 184, 163; }
        .callout-important { --callout-color: 147, 51, 234; } 

        .obsidian-callout {
            background-color: rgba(var(--callout-color), 0.1) !important;
            border-radius: 0.25rem;
            margin: 1.5em 0;
            padding: 1rem;
            border: none !important;
            overflow: hidden;
            font-size: 0.95em;
            font-style: normal !important;
            color: inherit !important;
            box-shadow: none;
        }
        
        .dark .obsidian-callout {
            background-color: rgba(var(--callout-color), 0.15) !important;
        }

        /* Nested Callouts Styling (Answer inside Question) */
        .obsidian-callout .obsidian-callout {
            margin-top: 1rem !important;
            margin-bottom: 0 !important;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.02);
        }
        
        .callout-title {
            font-weight: 600;
            display: flex;
            align-items: flex-start; /* Aligns content to top instead of vertical middle */
            color: rgb(var(--callout-color));
            background-color: transparent !important;
            padding: 0 0 0.5rem 0;
            margin: 0;
            line-height: 1.4;
        }
        
        .dark .callout-title {
            color: rgb(var(--callout-color));
            filter: brightness(1.2); 
        }

        .callout-title svg {
            margin-right: 0.5rem;
            margin-top: 0.1em; /* Tiny adjustment to align perfectly with the text baseline */
            width: 1.1em;
            height: 1.1em;
            stroke-width: 2px;
            flex-shrink: 0;
        }

        .obsidian-callout.is-collapsed .callout-title {
            padding-bottom: 0;
        }

        /* Fix for list padding inside callouts */
        .obsidian-callout > p,
        .callout-content > p { 
            padding: 0; 
            margin: 0; 
        }

        .obsidian-callout > ul, .obsidian-callout > ol,
        .callout-content > ul, .callout-content > ol { 
            padding: 0 0 0 1.5em; /* Restored left padding for bullets */
            margin: 0; 
        }

        .obsidian-callout > p + p,
        .callout-content > p + p,
        .obsidian-callout > * + ul,
        .callout-content > * + ul,
        .obsidian-callout > * + ol,
        .callout-content > * + ol {
            margin-top: 0.75rem;
        }

        /* ==========================================================
           Other Markdown Elements
           ========================================================== */
        .markdown-body code {
            background: #f1f5f9;
            padding: 0.2em 0.4em;
            border-radius: 0.25rem;
            font-size: 0.9em;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        .dark .markdown-body code {
            background: #111827; 
            color: #e5e7eb;
        }

        .markdown-body pre {
            background: #1e293b;
            color: #f8fafc;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 1.5em 0;
        }

        .markdown-body pre code {
            background: transparent;
            padding: 0;
            color: inherit;
        }

        .markdown-body img {
            max-width: 100%;
            height: auto;
            border-radius: 0.5rem;
            margin: 1.5em auto;
            display: block;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Table Resizing & Math Shrinking */
        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1em; 
            table-layout: auto; 
            margin: 1.5em 0;
            word-break: break-word; 
        }
        
        .markdown-body th, .markdown-body td {
            border: 1px solid #d1d5db;
            padding: 0.5rem 1rem;
            text-align: left;
        }

        .markdown-body td .katex {
            font-size: clamp(0.4em, 2.5vw, 1em); 
        }

        .markdown-body td .katex-display {
            max-width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 0.2em;
        }
        
        .dark .markdown-body th, .dark .markdown-body td { border-color: #1f2937; }
        .markdown-body th { background-color: #f3f4f6; font-weight: 600; }
        .dark .markdown-body th { background-color: #111827; }

        .obsidian-highlight {
            background-color: #fef08a;
            color: #854d0e;
            padding: 0 0.2rem;
            border-radius: 0.2rem;
        }
        
        .dark .obsidian-highlight {
            background-color: #854d0e;
            color: #fef08a;
        }

        .obsidian-internal-link {
            color: #7c3aed;
            text-decoration: none;
            opacity: 0.9;
        }
        .obsidian-internal-link::before { content: "📄 "; font-size: 0.9em; }

        /* --- Nested ToC Tree Styles --- */
        .toc-list { list-style: none !important; padding-left: 0 !important; margin: 0 !important; }
        .toc-nested { padding-left: 1.25rem !important; margin-left: 0.5rem !important; border-left: 1px solid #e5e7eb; }
        .dark .toc-nested { border-left-color: #1f2937; }
        
        .toc-item-container { display: flex; align-items: center; padding: 0.25rem 0; font-size: 0.95rem; }
        .toc-link { color: #4b5563; transition: color 0.2s; text-decoration: none; flex-grow: 1; }
        .dark .toc-link { color: #9ca3af; }
        .toc-link:hover { color: #7c3aed; }
        .dark .toc-link:hover { color: #a78bfa; }
        
        .toc-toggle {
            font-size: 0.6rem;
            display: inline-flex; align-items: center; justify-content: center;
            width: 1.2rem; height: 1.2rem;
            cursor: pointer;
            color: #9ca3af;
            transition: transform 0.2s ease;
        }
        .toc-toggle:hover { color: #4b5563; }
        .dark .toc-toggle:hover { color: #e5e7eb; }
        .toc-spacer { width: 1.2rem; display: inline-block; }

        /* --- Content Collapsible Styles --- */
        .hidden-by-h1, .hidden-by-h2, .hidden-by-h3, .hidden-by-h4, .hidden-by-h5, .hidden-by-h6 {
            display: none !important;
        }
        
        html { scroll-behavior: smooth; }

        /* Mobile Sidebar toggle */
        @media (max-width: 768px) {
            #sidebar { transform: translateX(-100%); transition: transform 0.3s ease-in-out; }
            #sidebar.open { transform: translateX(0); }
        }
        
        /* Select Dropdown Glass Styling */
        select option {
            background-color: white;
            color: black;
        }
        .dark select option {
            background-color: #0a0d13;
            color: white;
        }

        /* ==========================================================
           🖨️ PDF / PRINT STYLES
           ========================================================== */
        @media print {
            @page {
                size: A4;
                margin: 20mm;
            }

            /* Hide entirely UI elements (Navbar, Sidebar, Sliders, Overlays, Modals) */
            header, aside, #sidebarOverlay, #errorBox, #printModal, #goribModal {
                display: none !important;
            }

            /* Expand layout to full page */
            main {
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            .flex-1 { display: block !important; }
            .max-w-4xl { max-width: 100% !important; }
            
            /* Enforce White Theme & Standard Document Layout */
            body, .markdown-body {
                background: white !important;
                color: black !important;
                font-size: 12pt !important; /* Standard print font size */
                line-height: 1.4 !important; /* Tighter line height for print */
            }

            /* Drastically reduce vertical margins to avoid large gaps in print */
            .markdown-body p, 
            .markdown-body ul, 
            .markdown-body ol, 
            .markdown-body blockquote, 
            .obsidian-callout, 
            .markdown-body pre, 
            .markdown-body table,
            .overflow-x-auto {
                margin-top: 0.5em !important;
                margin-bottom: 0.5em !important;
            }

            .markdown-body h1, .markdown-body h2, .markdown-body h3, 
            .markdown-body h4, .markdown-body h5, .markdown-body h6 {
                color: black !important;
                margin-top: 1em !important;
                margin-bottom: 0.5em !important;
                page-break-after: avoid;
            }

            /* Allow tables, blockquotes, and callouts to naturally split across pages */
            .obsidian-callout, table, blockquote, tbody {
                page-break-inside: auto !important;
                break-inside: auto !important;
            }

            tr, img, pre {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }

            /* Clean up interactive elements that look weird on paper */
            .heading-toggle, .toc-toggle, .callout-toggle-arrow {
                display: none !important;
            }

            /* -------------------------------------------------------------
               🖨️ PRINT MODES LOGIC
               ------------------------------------------------------------- */
            
            /* PROOFS / ANSWERS (.callout-tip) */
            body.print-answers-none .callout-tip { display: none !important; }
            body.print-answers-selected .callout-tip.is-collapsed { display: none !important; }
            body.print-answers-all .callout-tip { display: block !important; }
            body.print-answers-all .callout-tip .callout-content { display: block !important; }

            body.print-proofs-none .callout-success { display: none !important; }
            body.print-proofs-selected .callout-success.is-collapsed { display: none !important; }
            body.print-proofs-all .callout-success { display: block !important; }
            body.print-proofs-all .callout-success .callout-content { display: block !important; }

            /* QUESTIONS (.callout-important) */
            /* If Questions are hidden, the inner answers (.callout-tip) naturally hide too! */
            body.print-qs-none .callout-important { display: none !important; }
        }
    </style>
</head>
<body class="bg-obsidian-bg text-obsidian-text dark:bg-obsidian-darkBg dark:text-obsidian-darkText min-h-screen flex flex-col">

    <!-- Protection Overlay -->
    <div id="goribModal" class="fixed inset-0 bg-obsidian-bg/80 dark:bg-obsidian-darkBg/90 backdrop-blur-xl z-[100] hidden flex-col items-center justify-center transition-opacity duration-300">
        <div class="bg-white dark:bg-[#111827] p-8 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-800 w-11/12 max-w-sm text-center">
            <div class="w-16 h-16 mx-auto bg-purple-100 dark:bg-purple-900/30 rounded-full flex items-center justify-center mb-4">
                <svg class="w-8 h-8 text-obsidian-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-2">Protected Note</h2>
            <p class="text-gray-500 dark:text-gray-400 text-sm mb-6">Please enter the access key to view this document.</p>
            <form id="goribForm" class="space-y-4">
                <div>
                    <input type="password" id="goribInput" class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-obsidian-accent transition-all" placeholder="Enter key" required>
                    <p id="goribError" class="text-red-500 text-xs mt-2 hidden">Incorrect key. Please try again.</p>
                </div>
                <button type="submit" class="w-full py-3 bg-obsidian-accent hover:bg-purple-700 text-white font-semibold rounded-lg transition-colors shadow-md">Unlock</button>
            </form>
        </div>
    </div>

    <!-- Print Options Modal -->
    <div id="printModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center transition-opacity">
        <div class="bg-white dark:bg-obsidian-darkBg border border-gray-200 dark:border-gray-800 rounded-xl shadow-2xl w-11/12 max-w-md overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-800 flex justify-between items-center bg-gray-50 dark:bg-gray-900/50">
                <h3 class="text-lg font-bold text-gray-800 dark:text-gray-200 flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    Print Document
                </h3>
                <button id="closePrintModal" class="text-gray-400 hover:text-gray-600 dark:hover:text-white transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="p-6">
                <div class="space-y-4">
                    
                    <!-- Questions Row -->
                    <div class="flex items-center justify-between pb-3 border-b border-gray-100 dark:border-gray-800">
                        <span class="font-semibold text-gray-800 dark:text-gray-200">Questions</span>
                        <div class="flex space-x-6">
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" id="cb-qs-all" checked class="w-4 h-4 rounded text-obsidian-accent focus:ring-obsidian-accent border-gray-300 dark:border-gray-600 dark:bg-gray-700">
                                <span class="text-sm dark:text-gray-300">All</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-not-allowed opacity-50" title="Questions cannot be selectively collapsed">
                                <input type="checkbox" disabled class="w-4 h-4 rounded border-gray-300 bg-gray-100 dark:bg-gray-800 dark:border-gray-700">
                                <span class="text-sm text-gray-500 dark:text-gray-400">Selected</span>
                            </label>
                        </div>
                    </div>

                    <!-- Answers Row -->
                    <div class="flex items-center justify-between pb-3 border-b border-gray-100 dark:border-gray-800">
                        <span class="font-semibold text-gray-800 dark:text-gray-200">Answers</span>
                        <div class="flex space-x-6">
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" id="cb-answers-all" checked class="w-4 h-4 rounded text-obsidian-accent focus:ring-obsidian-accent border-gray-300 dark:border-gray-600 dark:bg-gray-700">
                                <span class="text-sm dark:text-gray-300">All</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" id="cb-answers-selected" class="w-4 h-4 rounded text-obsidian-accent focus:ring-obsidian-accent border-gray-300 dark:border-gray-600 dark:bg-gray-700">
                                <span class="text-sm dark:text-gray-300">Selected</span>
                            </label>
                        </div>
                    </div>

                    <!-- Proofs Row -->
                    <div class="flex items-center justify-between pb-2">
                        <span class="font-semibold text-gray-800 dark:text-gray-200">Proofs</span>
                        <div class="flex space-x-6">
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" id="cb-proofs-all" checked class="w-4 h-4 rounded text-obsidian-accent focus:ring-obsidian-accent border-gray-300 dark:border-gray-600 dark:bg-gray-700">
                                <span class="text-sm dark:text-gray-300">All</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" id="cb-proofs-selected" class="w-4 h-4 rounded text-obsidian-accent focus:ring-obsidian-accent border-gray-300 dark:border-gray-600 dark:bg-gray-700">
                                <span class="text-sm dark:text-gray-300">Selected</span>
                            </label>
                        </div>
                    </div>

                </div>

                <div class="mt-8 flex justify-end">
                    <button id="btn-execute-print" class="px-5 py-2.5 bg-obsidian-accent hover:bg-[#6d28d9] text-white text-sm font-semibold rounded-lg shadow-md transition-colors w-full sm:w-auto">
                        Continue to Print
                    </button>
                </div>
            </div>
        </div>
    </div>

    <header class="sticky top-0 z-40 w-full backdrop-blur-lg flex-none border-b border-gray-200/50 dark:border-gray-800/50 bg-white/60 dark:bg-obsidian-darkBg/60">
        <div class="max-w-8xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center flex-1 space-x-2 sm:space-x-4">
                    <button id="menuBtn" class="md:hidden p-2 -ml-2 text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white rounded-md">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                    
                    <select id="subjectSelect" class="bg-white/30 dark:bg-white/10 backdrop-blur-md border border-gray-200/50 dark:border-gray-700/50 text-obsidian-text dark:text-obsidian-darkText text-sm rounded-md px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-obsidian-accent cursor-pointer truncate max-w-[140px] sm:max-w-[200px] shadow-sm font-medium transition-all">
                        </select>

                    <select id="chapterSelect" class="bg-white/30 dark:bg-white/10 backdrop-blur-md border border-gray-200/50 dark:border-gray-700/50 text-obsidian-text dark:text-obsidian-darkText text-sm rounded-md px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-obsidian-accent cursor-pointer flex-1 truncate max-w-[180px] sm:max-w-[350px] shadow-sm transition-all">

    <script>

        let currentAssetBase = "";

        const subjectSelect = document.getElementById('subjectSelect');

        // --- Theme Initialization ---
        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {

            } else {

            htmlElement.classList.toggle('dark');

        }

        themeToggleMobileBtn.addEventListener('click', toggleThemeAction);
        initTheme();

        // --- Font Size Initialization ---
        function initFontSize() {
            const savedSize = localStorage.getItem('noteFontSize') || '18';
            fontSizeSlider.value = savedSize;
            contentBody.style.setProperty('--note-font-size', `${savedSize}px`);
        }

        fontSizeSlider.addEventListener('input', (e) => {
            const size = e.target.value;
            contentBody.style.setProperty('--note-font-size', `${size}px`);
            localStorage.setItem('noteFontSize', size);
        });

        initFontSize();

        // --- Gorib Initialization ---
        function initGorib() {
            const gModal = document.getElementById('goribModal');
            const gForm = document.getElementById('goribForm');
            const gInput = document.getElementById('goribInput');
            const gError = document.getElementById('goribError');

            if (APP_CONFIG.ENABLE_GORIB) {
                // If not authenticated in current session, show modal and block body
                if (sessionStorage.getItem('isGorib') !== 'true') {
                    gModal.classList.remove('hidden');
                    gModal.classList.add('flex');
                    document.body.style.overflow = 'hidden'; 

                    gForm.addEventListener('submit', (e) => {
                        e.preventDefault();
                        if (gInput.value === APP_CONFIG.APP_GORIB) {
                            sessionStorage.setItem('isGorib', 'true');
                            gModal.classList.add('opacity-0');
                            setTimeout(() => {
                                gModal.classList.add('hidden');
                                gModal.classList.remove('flex');
                                document.body.style.overflow = ''; // Restore scrolling
                            }, 300);
                        } else {
                            gError.classList.remove('hidden');
                            gInput.value = '';
                            gInput.focus();
                        }
                    });
                }
            }
        }

        // --- Print/PDF Functionality via Modal ---
        function openPrintModal() {
            if (sidebar.classList.contains('open')) {
                toggleSidebar();
            }
            printModal.classList.remove('hidden');
        }

        function closePrintModal() {
            printModal.classList.add('hidden');
        }

        function executePrint() {
            closePrintModal();
            
            const wasDark = htmlElement.classList.contains('dark');
            if (wasDark) {
                htmlElement.classList.remove('dark');
            }

            let classesToAdd = [];
            
            // Collect Print CSS Logic depending on checkboxes
            if (document.getElementById('cb-proofs-all').checked) classesToAdd.push('print-proofs-all');
            else if (document.getElementById('cb-proofs-selected').checked) classesToAdd.push('print-proofs-selected');
            else classesToAdd.push('print-proofs-none');

            if (document.getElementById('cb-answers-all').checked) classesToAdd.push('print-answers-all');
            else if (document.getElementById('cb-answers-selected').checked) classesToAdd.push('print-answers-selected');
            else classesToAdd.push('print-answers-none');

            if (document.getElementById('cb-qs-all').checked) classesToAdd.push('print-qs-all');
            else classesToAdd.push('print-qs-none');

            if(classesToAdd.length > 0) {
                document.body.classList.add(...classesToAdd);
            }

            setTimeout(() => {
                window.print();
                
                // Cleanup after printing
                if(classesToAdd.length > 0) {
                    document.body.classList.remove(...classesToAdd);
                }
                if (wasDark) {
                    htmlElement.classList.add('dark');
                }
            }, 100);
        }

        printBtnDesktop.addEventListener('click', openPrintModal);
        printBtnMobile.addEventListener('click', openPrintModal);
        closePrintModalBtn.addEventListener('click', closePrintModal);
        
        // Tie executePrint to the new Continue Button
        document.getElementById('btn-execute-print').addEventListener('click', executePrint);

        // Print Modal Checkbox Mutual Exclusion (Clicking one unchecks the other)
        function setupCheckboxMutualExclusion(allId, selectedId) {
            const allCb = document.getElementById(allId);
            const selCb = document.getElementById(selectedId);
            if (!allCb || !selCb) return;

            allCb.addEventListener('change', () => {
                if (allCb.checked) selCb.checked = false;
            });
            selCb.addEventListener('change', () => {
                if (selCb.checked) allCb.checked = false;
            });
        }

        setupCheckboxMutualExclusion('cb-proofs-all', 'cb-proofs-selected');
        setupCheckboxMutualExclusion('cb-answers-all', 'cb-answers-selected');

        printModal.addEventListener('click', (e) => {
            if (e.target === printModal) {
                closePrintModal();

        // --- Navigation Initialization ---
        function initNavigation() {
            Object.keys(CURRICULUM).forEach(subject => {
                const option = document.createElement('option');
                option.value = subject;
                option.textContent = subject;
                subjectSelect.appendChild(option);
            });

            if(CURRICULUM["Physics-1st"]) {
                subjectSelect.value = "Physics-1st";
            }

            updateChapterList();

            const hasIdealGas = Array.from(chapterSelect.options).find(opt => opt.value.includes("Ideal Gas"));
            if(hasIdealGas) chapterSelect.value = hasIdealGas.value;

            subjectSelect.addEventListener('change', () => {
                updateChapterList();
                loadAndRenderMarkdown(); 
            });

            chapterSelect.addEventListener('change', () => {
                loadAndRenderMarkdown();
            });

            loadAndRenderMarkdown();
        }

        function updateChapterList() {
            const subject = subjectSelect.value;
            chapterSelect.innerHTML = ''; 
            
            const chapters = CURRICULUM[subject] || [];
            if(chapters.length === 0) {
                const option = document.createElement('option');
                option.value = "";
                option.textContent = "-- No Chapters Available --";
                chapterSelect.appendChild(option);
                return;
            }

            chapters.forEach(chapter => {
                const option = document.createElement('option');
                option.value = chapter;
                option.textContent = chapter;
                chapterSelect.appendChild(option);
            });
        }


        // --- Sidebar Logic ---
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            if (sidebar.classList.contains('open')) {
                sidebarOverlay.classList.remove('hidden');
                document.body.style.overflow = 'hidden'; 
            } else {
                sidebarOverlay.classList.add('hidden');
                document.body.style.overflow = '';
            }
        }

        menuBtn.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', toggleSidebar);

        // --- Markdown Preprocessing ---
        function preProcessObsidian(text) {
            let processed = text;
            
            // Fix missing blank lines between images and nested blockquotes/callouts
            // Automatically injects a spacing `>` line if an image is immediately followed by a callout
            processed = processed.replace(/(!\[\[.*?\]\]|!\[.*?\]\(.*?\))[ \t]*\r?\n(\s*(?:>[ \t]*){2,}|\s*>[ \t]*\[![a-zA-Z]+\])/g, "$1\n>\n$2");

            mathBlocks = []; 
            
            // 1. Protect Block Math ($$ ... $$)
            processed = processed.replace(/\$\$([\s\S]*?)\$\$/g, (match) => {
                mathBlocks.push(match);
                return `@@MATH_BLOCK_${mathBlocks.length - 1}@@`;
            });
            
            // 2. Protect Inline Math ($ ... $)
            processed = processed.replace(/\$([^\$]+?)\$/g, (match) => {
                mathBlocks.push(match);
                return `@@MATH_BLOCK_${mathBlocks.length - 1}@@`;
            });

            processed = processed.replace(/!\[\[([^\]]+)\]\]/g, (match, content) => {
                const parts = content.split('|');
                const rawFilename = parts[0].trim();
                const width = parts.length > 1 ? `width="${parts[1].trim()}"` : '';
                
                if (rawFilename.startsWith('http') || rawFilename.startsWith('data:')) {
                    return `<img src="${rawFilename}" ${width} alt="External Image">`;
                }
                
                const pureFilename = rawFilename.split('/').pop().split('\\').pop();
                const imgSrc = encodeURI(`${currentAssetBase}/${pureFilename}`);
                
                return `<img src="${imgSrc}" ${width} alt="${pureFilename}" onerror="this.outerHTML='<div class=\\'bg-red-50 text-red-600 border border-red-200 p-3 rounded text-sm my-2\\'><strong>⚠️ Image Not Found:</strong><br><code class=\\'break-all\\'>' + this.src + '</code><br>Check if image exists in folder.</div>'">`;
            });

            processed = processed.replace(/!\[(.*?)\]\((.*?)\)/g, (match, alt, href) => {
                if (href.startsWith('http') || href.startsWith('data:')) return match;
                
                let widthAttr = '';
                let cleanAlt = alt;
                if (alt.includes('|')) {
                    const altParts = alt.split('|');
                    const potentialWidth = altParts[altParts.length - 1];
                    if (!isNaN(potentialWidth)) {
                        widthAttr = `width="${potentialWidth}"`;
                        cleanAlt = altParts.slice(0, -1).join('|');
                    }
                }

                const pureFilename = decodeURIComponent(href).split('/').pop().split('\\').pop();
                const imgSrc = encodeURI(`${currentAssetBase}/${pureFilename}`); 
                
                return `<img src="${imgSrc}" alt="${cleanAlt}" ${widthAttr} onerror="this.outerHTML='<div class=\\'bg-red-50 text-red-600 border border-red-200 p-3 rounded text-sm my-2\\'><strong>⚠️ Image Not Found:</strong><br><code class=\\'break-all\\'>' + this.src + '</code><br>Check if image exists in folder.</div>'">`;
            });

            processed = processed.replace(/==([^=]+)==/g, '<span class="obsidian-highlight">$1</span>');

            processed = processed.replace(/\[\[([^\]]+)\]\]/g, (match, content) => {
                const parts = content.split('|');
                const linkTarget = parts[0];
                const displayText = parts.length > 1 ? parts[1] : parts[0];
                return `<a href="#" class="obsidian-internal-link" title="${linkTarget}">${displayText}</a>`;
            });

            return processed;
        }

        // --- ToC Generation ---
        function buildTableOfContents() {
            const contentDiv = document.getElementById('content');
            const tocContainer = document.getElementById('toc');
            tocContainer.innerHTML = ''; 

            const headings = Array.from(contentDiv.querySelectorAll('h1, h2, h3, h4, h5, h6'));
            
            if (headings.length === 0) {
                tocContainer.innerHTML = '<p class="text-sm text-gray-500 italic">No headings found.</p>';
                return;
            }

            const rootList = document.createElement('ul');
            rootList.className = 'toc-list';
            tocContainer.appendChild(rootList);

            const stack = [{ level: 0, element: rootList }];

            headings.forEach((heading, index) => {
                if (!heading.id) heading.id = 'heading-' + index;

                const level = parseInt(heading.tagName.substring(1));
                const text = heading.innerText;
                
                const li = document.createElement('li');
                const itemContainer = document.createElement('div');
                itemContainer.className = 'toc-item-container';
                
                const link = document.createElement('a');
                link.href = '#' + heading.id;
                link.textContent = text;
                link.className = 'toc-link truncate';
                
                link.addEventListener('click', () => {
                    if (window.innerWidth <= 768 && sidebar.classList.contains('open')) toggleSidebar();
                });

                itemContainer.appendChild(link);
                li.appendChild(itemContainer);

                while (stack[stack.length - 1].level >= level) stack.pop();

                const parent = stack[stack.length - 1];
                let parentList = parent.element.querySelector(':scope > ul.toc-nested');

                if (!parentList && parent.level > 0) {
                    parentList = document.createElement('ul');
                    parentList.className = 'toc-list toc-nested';
                    parent.element.appendChild(parentList);
                    
                    const parentContainer = parent.element.querySelector('.toc-item-container');
                    const toggleBtn = document.createElement('span');
                    toggleBtn.className = 'toc-toggle transform rotate-90 flex items-center justify-center transition-transform duration-200';
                    toggleBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width: 0.8em; height: 0.8em;"><polyline points="9 18 15 12 9 6"></polyline></svg>';
                    parentContainer.insertBefore(toggleBtn, parentContainer.firstChild);

                    toggleBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        parentList.classList.toggle('hidden');
                        toggleBtn.style.transform = parentList.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(90deg)';
                    });
                }

                const targetList = parent.level === 0 ? parent.element : parentList;
                targetList.appendChild(li);
                stack.push({ level: level, element: li });
            });

            document.querySelectorAll('.toc-item-container').forEach(container => {
                if (!container.querySelector('.toc-toggle')) {
                    const spacer = document.createElement('span');
                    spacer.className = 'toc-spacer';
                    container.insertBefore(spacer, container.firstChild);
                }
            });
        }

        function enhanceContentHeadings() {
            const headings = document.querySelectorAll('#content h1, #content h2, #content h3, #content h4, #content h5, #content h6');
            headings.forEach(heading => {
                const toggleBtn = document.createElement('span');
                toggleBtn.className = 'heading-toggle cursor-pointer mr-2 select-none text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 transition-transform duration-200 inline-flex items-center transform rotate-90 text-sm align-middle';
                toggleBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width: 1em; height: 1em;"><polyline points="9 18 15 12 9 6"></polyline></svg>';
                heading.prepend(toggleBtn);
                heading.style.cursor = 'pointer';
                heading.title = "Click to collapse/expand section";
                
                heading.addEventListener('click', (e) => {
                    if (e.target.tagName === 'A') return;
                    
                    const isCollapsed = heading.classList.toggle('collapsed');
                    toggleBtn.style.transform = isCollapsed ? 'rotate(0deg)' : 'rotate(90deg)';
                    
                    const level = parseInt(heading.tagName[1]);
                    let el = heading.nextElementSibling;
                    
                    while (el) {
                        if (el.tagName.match(/^H[1-6]$/)) {
                            if (parseInt(el.tagName[1]) <= level) break;
                        }
                        isCollapsed ? el.classList.add(`hidden-by-h${level}`) : el.classList.remove(`hidden-by-h${level}`);
                        el = el.nextElementSibling;
                    }
                });
            });
        }

        // --- Callout Generation ---
        function getCalloutIcon(type) {
            const icons = {

            if (['check', 'done'].includes(type)) return icons.success;

        function renderCallouts() {
            const blockquotes = document.querySelectorAll('#content blockquote');
            blockquotes.forEach(bq => {
                const firstP = bq.querySelector('p');
                if (!firstP) return;
                
                const match = firstP.innerHTML.match(/^\s*\[!([a-zA-Z]+)\][+-]?(.*?)(?:<br\s*\/?>|\n|$)/i);
                
                if (match) {
                    const type = match[1].toLowerCase();
                    const title = match[2].trim() || type.charAt(0).toUpperCase() + type.slice(1);
                    
                    firstP.innerHTML = firstP.innerHTML.substring(match[0].length);
                    if (firstP.innerHTML.trim() === '') firstP.style.display = 'none';
                    
                    bq.classList.add('obsidian-callout');
                    bq.classList.add(`callout-${type}`);
                    
                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'callout-title';
                    titleDiv.innerHTML = getCalloutIcon(type) + `<span>${title}</span>`;
                    
                    if (['tip'].includes(type)) {
                        titleDiv.classList.add('cursor-pointer', 'select-none');
                        
                        const toggleArrow = document.createElement('span');
                        toggleArrow.className = 'callout-toggle-arrow ml-auto transition-transform duration-200 transform';
                        toggleArrow.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width: 1em; height: 1em;"><polyline points="9 18 15 12 9 6"></polyline></svg>';
                        titleDiv.appendChild(toggleArrow);

                        const contentWrapper = document.createElement('div');
                        contentWrapper.className = 'callout-content hidden mt-2'; 
                        
                        while (bq.firstChild) {
                            contentWrapper.appendChild(bq.firstChild);
                        }
                        
                        bq.appendChild(titleDiv);
                        bq.appendChild(contentWrapper);
                        bq.classList.add('is-collapsed'); 

                        titleDiv.addEventListener('click', () => {
                            contentWrapper.classList.toggle('hidden');
                            bq.classList.toggle('is-collapsed');
                            if (contentWrapper.classList.contains('hidden')) {
                                toggleArrow.classList.remove('rotate-90'); 
                            } else {
                                toggleArrow.classList.add('rotate-90'); 
                            }
                        });
                    } else {
                        bq.insertBefore(titleDiv, bq.firstChild);
                    }
                }
            });
        }

        // --- Core Rendering Logic ---

                sidebarChapterTitle.textContent = "No Selection";
                document.getElementById('toc').innerHTML = '';
                return;

                let htmlContent = marked.parse(processedMarkdown, { headerIds: true, gfm: true, breaks: true });
                
                mathBlocks.forEach((block, i) => {
                    htmlContent = htmlContent.split(`@@MATH_BLOCK_${i}@@`).join(block);
                });

                contentDiv.innerHTML = htmlContent;

                contentDiv.querySelectorAll('table').forEach(table => {

                    wrapper.className = 'overflow-x-auto w-full my-6'; 
                    table.parentNode.insertBefore(wrapper, table);
                    wrapper.appendChild(table);
                });

                buildTableOfContents();
                enhanceContentHeadings();
                renderCallouts();
                
                if (window.renderMathInElement) {
                    const mathOptions = {
                        delimiters: [
                            {left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false},

        document.addEventListener('DOMContentLoaded', () => {
